<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dialog Mini App</title>
  <!-- Telegram Mini App SDK: window.Telegram.WebApp obyektini beradi -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Ranglar Telegram mavzusidan olinadi (yorug'/qorong'i rejimga moslashadi) */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #8a8a8a);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .hint { color: var(--hint); font-size: 14px; margin: 0; }
    .counter {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 16px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 12px;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="greeting">Salom!</h1>
    <p class="hint" id="platform">Telegram ichida oching</p>
  </div>

  <div class="card">
    <p class="hint">Bosishlar soni</p>
    <div class="counter" id="count">0</div>
    <button id="tap">Bosing</button>
  </div>

  <div class="card">
    <p class="hint">Telegram yuborgan foydalanuvchi ma'lumoti:</p>
    <pre id="user">—</pre>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    // 1) Telegram'ga app tayyorligini bildiramiz va to'liq ekranga yoyamiz
    tg.ready();
    tg.expand();

    // 2) Foydalanuvchi ma'lumoti (faqat Telegram ichida ochilganda bo'ladi).
    //    Eslatma: bu ma'lumotga frontendda ishonib bo'lmaydi — backendda
    //    initData imzosini tekshiramiz (keyingi dars).
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
      document.getElementById('greeting').textContent = `Salom, ${user.first_name}!`;
      document.getElementById('user').textContent = JSON.stringify(user, null, 2);
    }
    document.getElementById('platform').textContent =
      `Platforma: ${tg.platform} · SDK versiyasi: ${tg.version}`;

    // 3) Oddiy hisoblagich + tebranish (haptic) effekti
    let count = 0;
    document.getElementById('tap').addEventListener('click', () => {
      count++;
      document.getElementById('count').textContent = count;
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      if (count === 1) tg.MainButton.show();
      tg.MainButton.setText(`Natijani yuborish (${count})`);
    });

    // 4) Pastdagi katta ko'k tugma (MainButton)
    tg.MainButton.onClick(() => {
      tg.showAlert(`Siz ${count} marta bosdingiz!`);
    });
  </script>
</body>
</html>
