<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dialog Mini App</title>
  <!-- Telegram Mini App SDK: window.Telegram.WebApp obyektini beradi -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Ranglar Telegram mavzusidan olinadi (yorug'/qorong'i rejimga moslashadi) */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #8a8a8a);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .hint { color: var(--hint); font-size: 14px; margin: 0; }
    .counter {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 16px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 12px;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="greeting">Salom!</h1>
    <p class="hint" id="platform">Telegram ichida oching</p>
  </div>

  <div class="card">
    <p class="hint">Bosishlar soni</p>
    <div class="counter" id="count">0</div>
    <button id="tap">Bosing</button>
  </div>

  <div class="card">
    <h1>Premium ⭐</h1>
    <p class="hint" id="premium-status">Telegram Stars orqali sotib oling</p>
    <br>
    <button id="buy">Sotib olish — 1 ⭐</button>
  </div>

  <div class="card">
    <p class="hint">Telegram yuborgan foydalanuvchi ma'lumoti:</p>
    <pre id="user">—</pre>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const $ = (id) => document.getElementById(id);

    // Telegram Serverless endpointini chaqirish (tgcloud/endpoints/<name>.js).
    // initData'ni SDK o'zi yuboradi, platforma uni tekshiradi.
    function call(name, input) {
      return new Promise((resolve, reject) => {
        tg.Serverless.call(name, input || {}, (err, result) => {
          if (err) reject(err); else resolve(result);
        });
      });
    }

    function showError(err) {
      tg.showAlert((err && err.message) || 'Xatolik yuz berdi');
    }

    function renderPremium(premium) {
      $('premium-status').textContent = premium
        ? 'Premium faol! Rahmat ⭐'
        : 'Telegram Stars orqali sotib oling';
      $('buy').style.display = premium ? 'none' : '';
    }

    // 1) Telegram yuborgan foydalanuvchi ma'lumoti (faqat ko'rsatish uchun)
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
      $('greeting').textContent = `Salom, ${user.first_name}!`;
      $('user').textContent = JSON.stringify(user, null, 2);
    }
    $('platform').textContent = `Platforma: ${tg.platform} · SDK versiyasi: ${tg.version}`;

    // 2) Saqlangan holatni bazadan yuklaymiz
    call('getMe')
      .then((me) => {
        $('count').textContent = me.taps;
        renderPremium(me.premium);
      })
      .catch(showError);

    // 3) Hisoblagich — har bosish bazaga yoziladi
    $('tap').addEventListener('click', async () => {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      try {
        const { taps } = await call('tap');
        $('count').textContent = taps;
        tg.MainButton.setText(`Natija: ${taps}`).show();
      } catch (e) {
        showError(e);
      }
    });

    tg.MainButton.onClick(() => {
      tg.showAlert(`Siz jami ${$('count').textContent} marta bosdingiz!`);
    });

    // 4) Telegram Stars orqali to'lov
    $('buy').addEventListener('click', async () => {
      $('buy').disabled = true;
      try {
        const { link } = await call('createInvoice', { product: 'premium' });
        tg.openInvoice(link, (status) => {
          // status: 'paid' | 'cancelled' | 'failed' | 'pending'
          if (status === 'paid') {
            renderPremium(true);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          } else if (status === 'failed') {
            tg.showAlert('To\'lov amalga oshmadi');
          }
        });
      } catch (e) {
        showError(e);
      } finally {
        $('buy').disabled = false;
      }
    });
  </script>
</body>
</html>
